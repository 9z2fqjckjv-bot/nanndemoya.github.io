<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>移動代金シミュレーター ｜ 何でも屋</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --accent: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 30px; }
    header h1 { font-size: 1.8rem; color: #0f172a; margin-bottom: 8px; }
    header p { color: var(--text-muted); font-size: 0.95rem; }

    .grid { display: grid; grid-template-columns: 1fr; gap: 24px; }
    @media (min-width: 768px) {
      .grid { grid-template-columns: 1.2fr 0.8fr; }
    }

    .card { background: var(--card-bg); border-radius: 12px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05); border: 1px solid var(--border); }
    .card h2 { font-size: 1.3rem; margin-bottom: 20px; border-bottom: 2px solid var(--border); padding-bottom: 8px; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field.full { grid-column: 1 / -1; }

    label { font-size: 0.88rem; font-weight: 600; color: #334155; }
    input[type="text"], input[type="number"], select {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; background: #fff;
    }
    input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }
    .hint { font-size: 0.78rem; color: var(--text-muted); }

    .route-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
    .button-api {
      background: var(--primary); color: #fff; border: none; padding: 10px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s;
    }
    .button-api:hover { background: var(--primary-hover); }
    .button-api:disabled { background: #94a3b8; cursor: not-allowed; }
    .route-status { font-size: 0.85rem; min-height: 1.4em; color: var(--text-muted); }

    .inline-options { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 4px; }
    .check-option { display: flex; align-items: center; gap: 6px; font-weight: normal; cursor: pointer; font-size: 0.9rem; }

    /* Result Card */
    .result-card { background: #ffffff; border-top: 4px solid var(--primary); position: sticky; top: 20px; height: fit-content; }
    .result-total { text-align: center; background: #eff6ff; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    .result-total .label { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 4px; }
    .result-total .price { font-size: 2.2rem; font-weight: 700; color: var(--primary); }

    .breakdown { list-style: none; display: flex; flex-direction: column; gap: 10px; font-size: 0.9rem; }
    .breakdown li { display: flex; justify-content: space-between; border-bottom: 1px dashed var(--border); padding-bottom: 6px; }
    .breakdown li span { color: var(--text-muted); }
    .breakdown li strong { color: var(--text); }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>移動代金シミュレーター</h1>
    <p>住所からGoogle Maps Routes APIで自動取得した距離・時間をもとに移動実費を計算します。</p>
  </header>

  <main class="grid">
    <!-- 入力フォームエリア -->
    <section class="card">
      <h2>条件を入力してください</h2>
      <div class="form-grid">
        <div class="field full">
          <label for="originAddress">出発地住所</label>
          <input id="originAddress" placeholder="例：東京都渋谷区道玄坂1丁目" type="text" value="東京都渋谷区道玄坂1丁目"/>
          <span class="hint">スタッフの拠点・出発地を入力してください。</span>
        </div>

        <div class="field full">
          <label for="destinationAddress">目的地住所</label>
          <input id="destinationAddress" placeholder="例：東京都新宿区西新宿2丁目" type="text" value="東京都新宿区西新宿2丁目"/>
          <span class="hint">お客様の指定場所を入力してください。</span>
        </div>

        <div class="field full">
          <div class="route-actions">
            <button class="button-api" id="routeSearchButton" type="button">距離・所要時間を自動取得</button>
            <p class="route-status" id="routeStatus">住所を入力してボタンを押すと、距離と所要時間を自動反映します。</p>
          </div>
        </div>

        <div class="field">
          <label for="distanceKm">片道距離（km）</label>
          <input id="distanceKm" inputmode="decimal" min="0" step="0.1" type="number" value="5"/>
          <span class="hint">自動取得または手動入力</span>
        </div>

        <div class="field">
          <label for="travelMinutes">片道移動時間（分）</label>
          <input id="travelMinutes" inputmode="numeric" min="0" step="1" type="number" value="20"/>
          <span class="hint">目安の移動時間</span>
        </div>

        <div class="field">
          <label for="transportType">交通手段</label>
          <select id="transportType">
            <option value="mixed">複合交通（公共交通・車・船など）</option>
            <option value="public" selected>公共交通機関</option>
            <option value="car">自家用車・事業車</option>
            <option value="bike">自転車・徒歩</option>
            <option value="taxi">タクシー</option>
            <option value="airplane">飛行機</option>
            <option value="ferry">フェリー</option>
            <option value="customerCar">Let's Go Car's!（お客様の車）</option>
          </select>
        </div>

        <div class="field">
          <label for="roundTrip">往復設定</label>
          <select id="roundTrip">
            <option value="2" selected>往復で計算</option>
            <option value="1">片道のみで計算</option>
          </select>
        </div>

        <div class="field">
          <label for="parkingFee">駐車場・高速代など（円）</label>
          <input id="parkingFee" inputmode="numeric" min="0" step="10" type="number" value="0"/>
        </div>

        <div class="field">
          <label for="extraFee">その他実費（円）</label>
          <input id="extraFee" inputmode="numeric" min="0" step="10" type="number" value="0"/>
        </div>

        <div class="field full">
          <label>追加条件</label>
          <div class="inline-options">
            <label class="check-option"><input checked id="useMinimum" type="checkbox"/> 最低移動代金を適用</label>
            <label class="check-option"><input id="rushSurcharge" type="checkbox"/> 急ぎ・深夜など割増（20%）</label>
          </div>
        </div>
      </div>
    </section>

    <!-- 計算結果エリア -->
    <aside class="card result-card" aria-live="polite">
      <h2>計算結果</h2>
      <div class="result-total">
        <div class="label">移動代金の目安</div>
        <span class="price" id="totalPrice">¥0</span>
      </div>
      <ul class="breakdown" id="breakdown"></ul>
    </aside>
  </main>
</div>

<script>
  const GOOGLE_MAPS_API_KEY = 'AIzaSyB2SmrDXLXeYEaYnf_fNcor9T1I98-0cS4'; // 実際のAPIキーに置き換えてください

  const RATES = {
    mixed: { label: '複合交通', base: 0, perKm: 30, minimum: 300 },
    public: { label: '公共交通機関', base: 0, perKm: 30, minimum: 300 },
    car: { label: '自家用車・事業車', base: 0, perKm: 35, minimum: 300 },
    bike: { label: '自転車・徒歩', base: 0, perKm: 0, minimum: 0 },
    taxi: { label: 'タクシー', base: 500, perKm: 400, minimum: 1000 },
    airplane: { label: '飛行機', base: 8000, perKm: 22, minimum: 8000 },
    ferry: { label: 'フェリー', base: 2500, perKm: 60, minimum: 2500 },
    customerCar: { label: "Let's Go Car's!", base: 0, perKm: 0, minimum: 0 }
  };

  const yen = (value) => '¥' + Math.round(value).toLocaleString('ja-JP');

  const numberValue = (id) => {
    const el = document.getElementById(id);
    if (!el) return 0;
    const value = Number(el.value);
    return Number.isFinite(value) && value > 0 ? value : 0;
  };

  function renderBreakdown(items) {
    const list = document.getElementById('breakdown');
    if (!list) return;
    list.innerHTML = items.map((item) => `<li><span>${item.label}</span><strong>${item.value}</strong></li>`).join('');
  }

  function calcTransportCost() {
    const distance = numberValue('distanceKm');
    const minutes = numberValue('travelMinutes');
    const multiplier = Number(document.getElementById('roundTrip')?.value || 1);
    const type = document.getElementById('transportType')?.value || 'public';
    const parkingFee = numberValue('parkingFee');
    const extraFee = numberValue('extraFee');
    const useMinimum = document.getElementById('useMinimum')?.checked ?? true;
    const rushSurcharge = document.getElementById('rushSurcharge')?.checked ?? false;

    const rate = RATES[type] || RATES.public;

    const distanceCost = (rate.base + distance * rate.perKm) * multiplier;
    const minimumCost = useMinimum ? rate.minimum : 0;
    const subtotal = Math.max(distanceCost, minimumCost) + parkingFee + extraFee;
    const surcharge = rushSurcharge ? Math.round(subtotal * 0.2) : 0;
    const total = subtotal + surcharge;
    const totalDistance = distance * multiplier;
    const totalMinutes = minutes * multiplier;

    const totalPriceEl = document.getElementById('totalPrice');
    if (totalPriceEl) {
      totalPriceEl.textContent = yen(total);
    }

    renderBreakdown([
      { label: '交通手段', value: rate.label },
      { label: '計算距離', value: `${totalDistance.toLocaleString('ja-JP')} km` },
      { label: '移動時間の目安', value: `${totalMinutes.toLocaleString('ja-JP')} 分` },
      { label: '距離・交通手段分', value: yen(distanceCost) },
      { label: '最低移動代金', value: useMinimum ? yen(minimumCost) : '適用なし' },
      { label: '駐車場・高速代など', value: yen(parkingFee) },
      { label: 'その他実費', value: yen(extraFee) },
      { label: '割増（夜間・緊急等）', value: rushSurcharge ? yen(surcharge) : 'なし' }
    ]);
  }

  async function fetchRoute(origin, destination) {
    const response = await fetch('https://routes.googleapis.com/directions/v2:computeRoutes', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Goog-Api-Key': GOOGLE_MAPS_API_KEY,
        'X-Goog-FieldMask': 'routes.distanceMeters,routes.duration'
      },
      body: JSON.stringify({
        origin: { address: origin },
        destination: { address: destination },
        travelMode: 'DRIVE'
      })
    });

    if (!response.ok) {
      const errorData = await response.json().catch(() => null);
      const errorMessage = errorData?.error?.message || `HTTPエラー (${response.status})`;
      throw new Error(errorMessage);
    }

    const data = await response.json();
    const route = data.routes && data.routes[0];
    if (!route) {
      throw new Error('該当するルートが見つかりませんでした。');
    }

    const durationSec = route.duration ? Number(route.duration.replace('s', '')) : 0;

    return {
      distanceKm: (route.distanceMeters || 0) / 1000,
      durationMinutes: Math.ceil(durationSec / 60)
    };
  }

  async function updateRouteEstimate() {
    const originInput = document.getElementById('originAddress');
    const destinationInput = document.getElementById('destinationAddress');
    const statusEl = document.getElementById('routeStatus');
    const searchBtn = document.getElementById('routeSearchButton');

    const origin = originInput ? originInput.value.trim() : '';
    const destination = destinationInput ? destinationInput.value.trim() : '';

    if (!origin || !destination) {
      if (statusEl) {
        statusEl.textContent = '⚠️ 出発地と目的地の両方を入力してください。';
        statusEl.style.color = '#e53e3e';
      }
      return;
    }

    if (!GOOGLE_MAPS_API_KEY || GOOGLE_MAPS_API_KEY.includes('YOUR_API_KEY')) {
      if (statusEl) {
        statusEl.textContent = '⚠️ APIキーが未設定です。有効な API キーを設定してください。';
        statusEl.style.color = '#e53e3e';
      }
      return;
    }

    if (statusEl) {
      statusEl.textContent = '🔄 距離と所要時間を取得中...';
      statusEl.style.color = '#2563eb';
    }
    if (searchBtn) searchBtn.disabled = true;

    try {
      const { distanceKm, durationMinutes } = await fetchRoute(origin, destination);

      const distanceEl = document.getElementById('distanceKm');
      const minutesEl = document.getElementById('travelMinutes');

      if (distanceEl) distanceEl.value = distanceKm.toFixed(1);
      if (minutesEl) minutesEl.value = durationMinutes;

      calcTransportCost();

      if (statusEl) {
        statusEl.textContent = `✅ 取得成功：片道約 ${distanceKm.toFixed(1)} km / 約 ${durationMinutes} 分`;
        statusEl.style.color = '#16a34a';
      }
    } catch (error) {
      if (statusEl) {
        statusEl.textContent = `❌ 取得失敗：${error.message}`;
        statusEl.style.color = '#dc2626';
      }
    } finally {
      if (searchBtn) searchBtn.disabled = false;
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    const calcInputs = [
      'distanceKm',
      'travelMinutes',
      'transportType',
      'roundTrip',
      'parkingFee',
      'extraFee',
      'useMinimum',
      'rushSurcharge'
    ];

    calcInputs.forEach((id) => {
      const el = document.getElementById(id);
      if (el) {
        el.addEventListener('input', calcTransportCost);
        el.addEventListener('change', calcTransportCost);
      }
    });

    const searchBtn = document.getElementById('routeSearchButton');
    if (searchBtn) {
      searchBtn.addEventListener('click', updateRouteEstimate);
    }

    ['originAddress', 'destinationAddress'].forEach((id) => {
      const el = document.getElementById(id);
      if (el) {
        el.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            updateRouteEstimate();
          }
        });
      }
    });

    calcTransportCost();
  });
</script>
</body>
</html>
