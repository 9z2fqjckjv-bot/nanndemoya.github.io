  <style>
    :root {
      --bg: #f6f8fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #5b6472;
      --accent: #2563eb;
      --accent-dark: #1d4ed8;
      --border: #dbe3ee;
      --soft: #eff6ff;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
      background: linear-gradient(180deg, #eef4ff 0%, var(--bg) 240px);
      color: var(--text);
      line-height: 1.8;
    }

    .hero {
      padding: 64px 20px 44px;
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 58%, #60a5fa 100%);
      color: #fff;
      text-align: center;
    }

    .hero-inner,
    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.2rem);
      line-height: 1.25;
    }

    .lead {
      max-width: 720px;
      margin: 16px auto 0;
      color: rgba(255, 255, 255, 0.94);
    }

    .container {
      padding: 28px 20px 56px;
    }

    .card {
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 20px;
    }

    a {
      color: var(--accent);
      font-weight: 700;
    }

    .button {
      display: inline-block;
      padding: 12px 18px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
    }

    .button:hover {
      background: var(--accent-dark);
    }

    footer {
      padding: 0 20px 42px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 640px) {
      .hero {
        padding-top: 52px;
      }

      .card {
        padding: 22px 18px;
      }
    }
  </style>
