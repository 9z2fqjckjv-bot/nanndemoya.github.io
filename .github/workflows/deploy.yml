name: SFTP Deploy to Xserver

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SFTP (SSH Key)
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }} # パスフレーズ未設定時は不要
          REMOTE_HOST: ${{ secrets.SFTP_HOST }}
          REMOTE_USER: ${{ secrets.SFTP_USERNAME }}
          PORT: ${{ secrets.SFTP_PORT }}
          # Xserver上の転送先絶対パスを指定
          TARGET: /home/${{ secrets.SFTP_USERNAME }}/${{ secrets.SFTP_HOST }}/public_html/
          # 除外したいファイル・フォルダを指定
          EXCLUDE: "/.git/, /.github/, /node_modules/"
