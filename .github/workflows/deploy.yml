name: Build and SFTP Deploy to Xserver

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: xserver-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p deploy-artifact
          rsync -a ./ deploy-artifact/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'node_modules/' \
            --exclude 'logs/' \
            --exclude 'deploy-artifact/'

      - name: Deploy via SFTP (SSH Key)
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SFTP_HOST }}
          REMOTE_USER: ${{ secrets.SFTP_USERNAME }}
          REMOTE_PORT: ${{ secrets.SFTP_PORT }}
        with:
          SSH_PRIVATE_KEY: ${{ env.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ env.REMOTE_HOST }}
          REMOTE_USER: ${{ env.REMOTE_USER }}
          REMOTE_PORT: ${{ env.REMOTE_PORT }}
          SOURCE: "deploy-artifact/"
          TARGET: /home/${{ env.REMOTE_USER }}/nanndemoya.net/public_html/
          EXCLUDE: "/.git/, /.github/, /node_modules/"
