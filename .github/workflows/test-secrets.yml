name: Test Secrets

on:
  push:
    branches:
      - main

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret existence
        run: |
          echo "Checking Secrets..."
          if [ -n "${{ secrets.SSH_PRIVATE_KEY }}" ]; then echo "SSH_PRIVATE_KEY: EXISTS"; else echo "SSH_PRIVATE_KEY: EMPTY"; fi
          if [ -n "${{ secrets.SFTP_HOST }}" ]; then echo "SFTP_HOST: EXISTS"; else echo "SFTP_HOST: EMPTY"; fi
          if [ -n "${{ secrets.SFTP_USERNAME }}" ]; then echo "SFTP_USERNAME: EXISTS"; else echo "SFTP_USERNAME: EMPTY"; fi
          if [ -n "${{ secrets.SFTP_PORT }}" ]; then echo "SFTP_PORT: EXISTS"; else echo "SFTP_PORT: EMPTY"; fi
